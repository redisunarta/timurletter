<script>
/* Highlights the section currently being read in the outline.
   Progressive enhancement: without this the outline is still a working list
   of anchor links. Marks the last heading scrolled past, so the highlight
   reflects the section you are inside rather than the next one coming up. */
(function () {
  var toc = document.querySelector('.toc');
  if (!toc) return;
  var links = [].slice.call(toc.querySelectorAll('a'));
  var targets = links.map(function (a) {
    return document.getElementById(decodeURIComponent(a.hash.slice(1)));
  });
  if (!targets.length || targets.indexOf(null) > -1) return;

  var ticking = false;
  function update() {
    ticking = false;
    var i = 0;
    for (var n = 0; n < targets.length; n++) {
      if (targets[n].getBoundingClientRect().top <= 120) i = n;
    }
    /* at the very bottom, always show the last section as current */
    if (window.innerHeight + window.scrollY >= document.body.scrollHeight - 2) {
      i = targets.length - 1;
    }
    links.forEach(function (a, n) {
      if (n === i) { a.setAttribute('aria-current', 'true'); }
      else { a.removeAttribute('aria-current'); }
    });
  }
  function onScroll() {
    if (!ticking) { ticking = true; requestAnimationFrame(update); }
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll, { passive: true });
  update();
})();
</script>
